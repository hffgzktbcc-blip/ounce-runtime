name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel the older run when a PR or branch gets a new push, so macOS/Windows runners are not tied up on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Docs-only pull requests (Markdown, docs/, LICENSE, issue templates) skip the Rust build and test
  # jobs. Anything else, including workflow edits, runs everything, and so does every push to main
  # and manual dispatch. Cleanliness and cargo-deny always run (they are cheap).
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Decide scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
            echo "Could not list changed files; running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/|^LICENSE|^\.github/ISSUE_TEMPLATE/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping Rust build and test jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  cleanliness:
    name: Cleanliness check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository cleanliness (No retail keys, firmware, or copyright assets)
        run: |
          echo "Checking for prohibited key or container extensions..."
          if git ls-files | grep -iE '\.(keys|nca|nsp|xci)$'; then
            echo "ERROR: Found prohibited binary/container files tracked in repository!"
            exit 1
          fi
          echo "Checking for forbidden key keywords in tracked source files..."
          if git ls-files | grep -v '\.gitignore' | xargs grep -lniE 'prod\.keys|title\.keys'; then
            echo "ERROR: Found forbidden key references in tracked files!"
            exit 1
          fi
          echo "Cleanliness check passed."

  cargo-deny:
    name: Cargo Deny (licenses, bans, advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --release

      - name: Run 25-stage integration verification suite
        run: cargo run --release -- test

  gpu-present:
    name: GPU presentation feature (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # lavapipe (mesa-vulkan-drivers) is a software Vulkan driver, so the offscreen
      # GPU blit test really runs on runners without a GPU instead of skipping.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev mesa-vulkan-drivers libvulkan1

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: gpu-present

      - name: Build with gpu-present
        run: cargo build --release --features gpu-present

      - name: Run unit tests with gpu-present
        run: cargo test --release --features gpu-present -- --nocapture --test-threads=1


  native-jit:
    name: Tier-4 native code (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu/windows are x86_64, macos-latest is Apple Silicon (MAP_JIT path).
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: native-jit

      - name: Run recompiler crate tests (W^X buffer, generated code execution)
        run: cargo test --release -p ounce-recompiler

      - name: Build with native-jit
        run: cargo build --release --features native-jit

      - name: Run Tier-4 host self-test
        run: cargo run --release --features native-jit -- jit-selftest

      - name: Run Tier-4 unit tests & differential fuzzer
        run: cargo test --release --features native-jit -- --nocapture
