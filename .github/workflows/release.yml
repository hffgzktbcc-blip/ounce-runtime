name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: ounce-runtime
            archive_name: ounce-runtime-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: ounce-runtime
            archive_name: ounce-runtime-linux-arm64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: ounce-runtime
            archive_name: ounce-runtime-macos-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: ounce-runtime.exe
            archive_name: ounce-runtime-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check release tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Test release candidate
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Run 25-stage integration verification on release candidate
        run: cargo run --release --locked --target ${{ matrix.target }} -- test

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Generate license, Corresponding Source notices, and SPDX 2.3 SBOM
        shell: bash
        run: |
          python scripts/bundle_release_notices.py --target "${{ matrix.target }}" --output-dir work/stage
          python scripts/generate_sbom.py --target "${{ matrix.target }}" --output work/stage/ounce-runtime.spdx.json
          cp work/stage/ounce-runtime.spdx.json "${{ matrix.archive_name }}.spdx.json"
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} work/stage/${{ matrix.binary_name }}
          cp LICENSE work/stage/LICENSE
          cp THIRD_PARTY.md work/stage/THIRD_PARTY.md

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf "${{ matrix.archive_name }}" -C work/stage \
            "${{ matrix.binary_name }}" \
            LICENSE \
            THIRD_PARTY.md \
            THIRD_PARTY_LICENSES.txt \
            CORRESPONDING_SOURCE.txt \
            ounce-runtime.spdx.json

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path work/stage/* -DestinationPath "${{ matrix.archive_name }}"

      - name: Write SHA-256 checksum (Unix)
        if: runner.os != 'Windows'
        run: shasum -a 256 "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"

      - name: Write SHA-256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "${{ matrix.archive_name }}"
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

      - name: Attest release archive provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "${{ matrix.archive_name }}"

      - name: Upload release asset artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
            ${{ matrix.archive_name }}.spdx.json
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate archive checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.spdx.json > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
